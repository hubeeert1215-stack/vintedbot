name: Vinted Monitor

on:
  repository_dispatch:
    types: [check-vinted]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: vinted-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python vinted_monitor.py

      - name: Save seen items back to repo
        run: |
          git config user.name "vinted-monitor-bot"
          git config user.email "actions@github.com"
          git add vinted_seen_items.json
          if ! git diff --quiet --cached; then
            git commit -m "update seen items"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "Push nieudany, probuje pobrac zmiany i sprobowac ponownie ($i/5)..."
              git pull --rebase -X ours
              sleep 2
            done
          fi
